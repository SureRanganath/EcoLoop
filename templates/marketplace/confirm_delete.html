{% extends 'base.html' %}
{% block title %}Delete Listing{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
        <h4 class="fw-bold mb-2">Delete Listing?</h4>
        <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ listing.title }}</strong>? This action cannot be undone.</p>
        <div class="d-flex justify-content-center gap-3">
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          </form>
          <a href="{% url 'listing_detail' listing.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
