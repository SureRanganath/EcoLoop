{% extends 'base.html' %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-eco-green mb-3">404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{% url 'home' %}" class="btn btn-eco px-4">Go Home</a>
      <a href="{% url 'marketplace' %}" class="btn btn-outline-success px-4">Browse Marketplace</a>
    </div>
  </div>
</div>
{% endblock %}
